# The settings of the command "alembic", the migration tool. Run it in this
# folder, with the settings of the database:
#
#     uv run --env-file .env alembic current      which migration ran last
#     uv run --env-file .env alembic history      every migration, in order
#     uv run --env-file .env alembic revision --autogenerate -m "what changes"
#                                                 a draft of a new migration
#
# The app and the tests do not read this file: they run the migrations
# through src/book_teller/migrate.py.

[alembic]
# Where the migrations are.
script_location = src/book_teller/migrations
# So that the migrations find the code of the app.
prepend_sys_path = src
