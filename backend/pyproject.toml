[project]
name = "book-teller"
version = "0.1.0"
description = "Turns a book into a podcast series, and checks every script against the book."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.27.0",
    "fastapi>=0.163.1",
    "httpx2>=2.16.2",
    "langchain-openai>=1.8.5",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

# The tests: only the folder "tests". The app's code is found in "src".
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A warning fails the test run. A warning that a library will stop working
# with another one was once left unseen.
filterwarnings = [
    "error",
    # One warning is let through, by its words, its kind and its module.
    # LangChain brings the library langsmith. langsmith 0.16.2 calls a function
    # that Python 3.14 names as outdated, each time it is loaded. No code of
    # ours can avoid it. The fix waits at the library:
    # https://github.com/langchain-ai/langsmith-sdk/pull/3347
    # Take this line out when a release of langsmith holds the fix.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith._internal._beta_decorator",
]

# The linter and the formatter.
[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# E, F: mistakes and style. I: the order of imports. B: likely bugs. UP: old Python.
select = ["E", "F", "I", "B", "UP"]

# The type checker, in strict mode.
[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
